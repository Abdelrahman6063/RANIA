 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RANIA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap');

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            min-height:100vh; min-height:100dvh;
            background:#0a0505;
            font-family:'Cairo',sans-serif;
            user-select:none;
            -webkit-tap-highlight-color:transparent;
            -webkit-user-select:none;
            overflow:hidden;
            color:#fff;
            -webkit-font-smoothing:antialiased;
        }

        .bg-image { position:fixed; inset:0; z-index:0; }
        .bg-image img { width:100%; height:100%; object-fit:cover; display:block; filter:brightness(0.45) contrast(1.05); will-change:transform; content-visibility:auto; }
        .bg-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.4); z-index:1; }

        .rania-title {
            position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:35;
            font-family:'Playfair Display',serif; font-size:1.8em; font-weight:900; letter-spacing:8px;
            background:linear-gradient(135deg,#fbbf24,#ec4899,#3b82f6,#f472b6);
            background-size:300% 300%;
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            animation:titleGlow 3s ease infinite;
            will-change:background-position;
            pointer-events:none;
        }
        @keyframes titleGlow { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }

        .login-page { position:fixed; inset:0; z-index:40;
            display:flex; align-items:center; justify-content:center;
            content-visibility:auto; }
        .login-page.hidden { display:none;
            content-visibility:hidden; }

        .login-card {
            width:320px; padding:35px 28px;
            background:transparent;
            backdrop-filter:none; -webkit-backdrop-filter:none;
            border-radius:20px; text-align:center;
            border:1px solid rgba(255,255,255,0.15);
            box-shadow:0 20px 60px rgba(0,0,0,0.5);
            animation:cardIn 0.6s ease-out;
            position:relative;
            will-change:transform,opacity;
        }
        @keyframes cardIn { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .login-card::before {
            content:''; position:absolute; inset:-3px; border-radius:22px; padding:3px;
            background:linear-gradient(135deg,#3b82f6,#ef4444,#3b82f6,#ef4444,#3b82f6);
            background-size:300% 300%; animation:boxGlow 4s linear infinite;
            -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            mask-composite:exclude; z-index:-1;
        }
        @keyframes boxGlow { 0% { background-position:0% 50%; } 100% { background-position:300% 50%; } }
        .login-title { font-family:'Playfair Display',serif; font-size:1.8em; font-weight:900; letter-spacing:6px; background:linear-gradient(135deg,#fbbf24,#ec4899,#3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:5px; }
        .login-subtitle { color:rgba(255,255,255,0.6); font-size:0.78em; letter-spacing:3px; margin-bottom:22px; }
        .input-group { margin-bottom:14px; text-align:right; }
        .input-group label { display:block; color:#fde68a; font-size:0.75em; font-weight:600; margin-bottom:4px; letter-spacing:1px; }
        .input-group input {
            width:100%; padding:12px 14px;
            background:transparent;
            border:1.5px solid rgba(255,255,255,0.3);
            border-radius:12px; color:#fff; font-size:0.9em; outline:none;
            transition:all 0.3s ease; text-align:right; font-family:'Cairo',sans-serif;
        }
        .input-group input:focus { border-color:#fbbf24; box-shadow:0 0 20px rgba(251,191,36,0.3);
            background:transparent; }
        .input-group input::placeholder { color:rgba(255,255,255,0.35); }
        .login-btn { width:100%; padding:13px; border:none; border-radius:14px; background:linear-gradient(135deg,#3b82f6,#ec4899,#fbbf24,#3b82f6); background-size:300% 300%; color:#fff; font-size:1em; font-weight:700; cursor:pointer; letter-spacing:3px; font-family:'Cairo',sans-serif; transition:all 0.4s ease; box-shadow:0 8px 25px rgba(59,130,246,0.3); }
        .login-btn:hover { background-position:right center; box-shadow:0 12px 35px rgba(236,72,153,0.5); letter-spacing:5px; }
        .login-btn:active { transform:scale(0.95); }
        .login-btn.error { animation:shake 0.5s ease; background:linear-gradient(135deg,#ef4444,#dc2626,#ef4444); }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 50%{transform:translateX(8px);} 75%{transform:translateX(-5px);} }
        .music-box { margin-top:16px; padding:10px 14px; background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,255,255,0.15); border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; }
        .music-btn { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.1); border:1.5px solid rgba(255,255,255,0.3); color:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.3s ease; }
        .music-btn:active { background:rgba(255,255,255,0.25); }
        .music-btn.playing { background:rgba(59,130,246,0.4); border-color:#3b82f6; box-shadow:0 0 15px rgba(59,130,246,0.4); }
        .music-label { color:rgba(255,255,255,0.5); font-size:0.7em; letter-spacing:2px; }
        .music-title { color:#fde68a; font-size:0.75em; font-weight:600; }

        .messages-page { position:fixed; inset:0; z-index:40; display:none;
            content-visibility:hidden; }
        .messages-page.show { display:block;
            content-visibility:visible; }

        .boxes-container { position:fixed; inset:0; z-index:10;
            overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
            scroll-snap-type:y mandatory; padding:70px 16px 30px;
            will-change:scroll-position; }
        .boxes-container::-webkit-scrollbar { width:0; }

        .boxes-track { display:flex; flex-direction:column; align-items:center; gap:20px; max-width:420px; margin:0 auto; padding-bottom:20px; }

        .box { width:280px; height:340px;
            scroll-snap-align:center; flex-shrink:0; cursor:pointer; position:relative;
            background:transparent; border-radius:20px;
            display:flex; align-items:center; justify-content:center; flex-direction:column;
            transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);
            will-change:transform;
            content-visibility:auto;
            contain:layout style paint; }
        .box:active { transform:scale(0.95); }

        .laser-edge { position:absolute; inset:0; border-radius:20px; pointer-events:none; overflow:hidden; }
        .laser-edge::before { content:''; position:absolute; inset:-12px; border-radius:32px; padding:12px;
            background:linear-gradient(90deg,rgba(239,68,68,0.3),rgba(239,68,68,1),rgba(239,68,68,1),rgba(34,197,94,1),rgba(34,197,94,1),rgba(34,197,94,0.3),rgba(34,197,94,1),rgba(34,197,94,1),rgba(239,68,68,1),rgba(239,68,68,1),rgba(239,68,68,0.3));
            background-size:400% 100%; animation:laserFlow 2.5s linear infinite;
            -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            mask-composite:exclude; will-change:background-position; }
        .laser-edge::after { content:''; position:absolute; inset:-24px; border-radius:44px; padding:24px;
            background:linear-gradient(90deg,transparent,rgba(239,68,68,0.25),rgba(239,68,68,0.6),rgba(34,197,94,0.6),rgba(34,197,94,0.25),transparent,rgba(34,197,94,0.25),rgba(34,197,94,0.6),rgba(239,68,68,0.6),rgba(239,68,68,0.25),transparent);
            background-size:400% 100%; animation:laserFlow 2.5s linear infinite;
            -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            mask-composite:exclude; will-change:background-position; }
        @keyframes laserFlow { 0% { background-position:0% 50%; } 100% { background-position:400% 50%; } }

        .box-heart { font-size:55px; animation:heartBeat 1.2s ease-in-out infinite; position:relative; z-index:1; will-change:transform; }
        @keyframes heartBeat { 0%,100%{transform:scale(1);} 15%{transform:scale(1.25);} 30%{transform:scale(1);} 45%{transform:scale(1.2);} 60%{transform:scale(1);} }
        .box-open { font-family:'Playfair Display',serif; font-size:1.3em; font-weight:700; letter-spacing:5px; color:#fff; text-shadow:0 0 15px rgba(255,255,255,0.5); margin-top:10px; position:relative; z-index:1; animation:openPulse 2s ease-in-out infinite; will-change:opacity; }
        @keyframes openPulse { 0%,100%{opacity:0.7;} 50%{opacity:1; text-shadow:0 0 25px rgba(255,255,255,0.9),0 0 45px rgba(239,68,68,0.5);} }
        .box-number { position:absolute; top:12px; right:16px; font-family:'Amiri',serif; font-size:1em; font-weight:900; color:rgba(255,255,255,0.5); z-index:1; }

        .private-box { width:280px; height:340px;
            scroll-snap-align:center; flex-shrink:0; cursor:pointer; position:relative;
            background:transparent; border-radius:20px;
            display:flex; align-items:center; justify-content:center; flex-direction:column;
            transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);
            will-change:transform;
            content-visibility:auto;
            contain:layout style paint; }
        .private-box:active { transform:scale(0.95); }
        .private-box .laser-edge::before { background:linear-gradient(90deg,rgba(239,68,68,0.3),rgba(239,68,68,1),rgba(239,68,68,1),rgba(220,38,38,1),rgba(220,38,38,1),rgba(239,68,68,0.3),rgba(220,38,38,1),rgba(220,38,38,1),rgba(239,68,68,1),rgba(239,68,68,1),rgba(239,68,68,0.3)); }
        .private-box .laser-edge::after { background:linear-gradient(90deg,transparent,rgba(239,68,68,0.25),rgba(239,68,68,0.6),rgba(220,38,38,0.6),rgba(220,38,38,0.25),transparent,rgba(220,38,38,0.25),rgba(220,38,38,0.6),rgba(239,68,68,0.6),rgba(239,68,68,0.25),transparent); }
        .private-box-heart { font-size:55px; animation:heartBeat 1.2s ease-in-out infinite; position:relative; z-index:1; will-change:transform; }
        .private-box-text { font-family:'Playfair Display',serif; font-size:1.1em; font-weight:900; letter-spacing:5px; color:#ef4444; text-shadow:0 0 15px rgba(239,68,68,0.5); margin-top:10px; position:relative; z-index:1; animation:openPulse 2s ease-in-out infinite; will-change:opacity; }

        .counter-wrapper { display:flex; flex-direction:column; align-items:center; gap:12px; scroll-snap-align:center; padding:10px 0; }
        .counter { display:flex; gap:8px; padding:10px 20px; background:rgba(0,0,0,0.55); border:2px solid rgba(255,255,255,0.2); border-radius:20px; backdrop-filter:blur(12px); font-size:1.1em; }
        .counter-item { text-align:center; min-width:38px; }
        .counter-value { font-size:1.2em; font-weight:900; color:#fbbf24; font-family:'Amiri',serif; line-height:1; text-shadow:0 0 10px rgba(251,191,36,0.5); }
        .counter-label { font-size:0.45em; color:#fde68a; letter-spacing:2px; opacity:0.8; }
        .counter-sep { color:rgba(255,255,255,0.3); font-size:0.8em; display:flex; align-items:center; }

        .msg-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.93); z-index:80; display:none; align-items:center; justify-content:center; flex-direction:column;
            content-visibility:hidden; }
        .msg-overlay.show { display:flex;
            content-visibility:visible; }
        .msg-card { width:92vw; max-width:420px; border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.8); position:relative; background:#1a0a04; animation:popIn 0.5s cubic-bezier(0.4,0,0.2,1); will-change:transform,opacity; }
        @keyframes popIn { from { transform:scale(0.5); opacity:0; } to { transform:scale(1); opacity:1; } }
        .msg-card img { width:100%; height:auto; display:block; filter:brightness(0.5); aspect-ratio:720/1011; object-fit:cover; content-visibility:auto; }
        .typewriter { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:#fff; font-family:'Amiri','Reem Kufi',serif; font-size:0.95em; line-height:2.4; font-weight:600; pointer-events:none; width:84%; max-height:75%; overflow-y:auto; }
        .typewriter.small-text { font-size:0.8em; line-height:2.1; }
        .typewriter .cursor { display:inline-block; width:2px; height:1.2em; background:#fff; margin-right:3px; animation:blink 0.8s step-end infinite; vertical-align:text-bottom; }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        .close-btn { position:absolute; top:10px; right:10px; width:34px; height:34px; background:rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.4); border-radius:50%; color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:90; }
        .close-btn:active { background:rgba(255,255,255,0.3); }
        .nav-arrows { display:flex; gap:12px; margin-top:16px; }
        .nav-arrow { width:42px; height:42px; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.3); border-radius:50%; color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .nav-arrow:active { background:rgba(255,255,255,0.2); }
        .nav-arrow:disabled { opacity:0.3; pointer-events:none; }

        /* ===== PRIVATE LOGIN - شفاف بالكامل ===== */
        .private-login-page { position:fixed; inset:0; z-index:50;
            display:none; align-items:center; justify-content:center;
            background:rgba(0,0,0,0.3);
            content-visibility:hidden; }
        .private-login-page.show { display:flex;
            content-visibility:visible; }

        .private-login-card {
            width:300px; padding:35px 28px;
            background:transparent;
            backdrop-filter:none; -webkit-backdrop-filter:none;
            border-radius:20px; text-align:center;
            border:1px solid rgba(239,68,68,0.35);
            box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(239,68,68,0.2);
            position:relative; z-index:2;
            will-change:transform;
        }
        .private-login-card::before { content:''; position:absolute; inset:-3px; border-radius:22px; padding:3px;
            background:linear-gradient(135deg,#ef4444,#dc2626,#ef4444,#dc2626,#ef4444);
            background-size:300% 300%; animation:boxGlow 4s linear infinite;
            -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
            mask-composite:exclude; z-index:-1; }
        .private-login-title { font-family:'Playfair Display',serif; font-size:2em; font-weight:900; letter-spacing:8px; background:linear-gradient(135deg,#ef4444,#dc2626,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:5px; }
        .private-login-subtitle { color:rgba(255,255,255,0.5); font-size:0.75em; letter-spacing:3px; margin-bottom:22px; }
        .private-login-card .input-group { margin-bottom:14px; text-align:right; }
        .private-login-card .input-group label { display:block; color:#fca5a5; font-size:0.75em; font-weight:600; margin-bottom:4px; letter-spacing:1px; }
        .private-login-card .input-group input {
            width:100%; padding:12px 14px;
            background:transparent;
            border:1.5px solid rgba(239,68,68,0.4);
            border-radius:12px; color:#fff; font-size:0.9em; outline:none;
            transition:all 0.3s ease; text-align:right; font-family:'Cairo',sans-serif;
        }
        .private-login-card .input-group input:focus { border-color:#ef4444; box-shadow:0 0 20px rgba(239,68,68,0.35);
            background:transparent; }
        .private-login-card .input-group input::placeholder { color:rgba(239,68,68,0.4); }
        .private-login-btn { width:100%; padding:13px; border:none; border-radius:14px; background:linear-gradient(135deg,#ef4444,#dc2626,#fbbf24,#ef4444); background-size:300% 300%; color:#fff; font-size:1em; font-weight:700; cursor:pointer; letter-spacing:3px; font-family:'Cairo',sans-serif; transition:all 0.4s ease; box-shadow:0 8px 25px rgba(239,68,68,0.35); }
        .private-login-btn:hover { background-position:right center; box-shadow:0 12px 35px rgba(239,68,68,0.6); letter-spacing:5px; }
        .private-login-btn:active { transform:scale(0.95); }
        .private-login-btn.error { animation:shake 0.5s ease; background:linear-gradient(135deg,#dc2626,#991b1b,#dc2626); }
        .private-close { position:absolute; top:10px; left:10px; width:28px; height:28px; background:rgba(0,0,0,0.6); border:2px solid rgba(239,68,68,0.4); border-radius:50%; color:#fff; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:55; }
        .private-close:active { background:rgba(239,68,68,0.3); }

        .private-messages-page { position:fixed; inset:0; z-index:50; display:none;
            content-visibility:hidden; }
        .private-messages-page.show { display:block;
            content-visibility:visible; }
        .private-messages-bg { position:fixed; inset:0; z-index:0; }
        .private-messages-bg img { width:100%; height:100%; object-fit:cover; display:block; filter:brightness(0.4); will-change:transform;
            content-visibility:auto; }
        .private-messages-bg-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.45); z-index:1; }

        .typewriter::-webkit-scrollbar { width:0; }
        .boxes-container::-webkit-scrollbar { width:0; }
    </style>
</head>
<body>

    <div class="bg-image"><img src="back3.jpeg" alt="Background" loading="lazy" onerror="this.style.display='none';"></div>
    <div class="bg-overlay"></div>
    <div class="rania-title">RANIA</div>

    <div class="login-page" id="loginPage">
        <div class="login-card">
            <div class="login-title">مرحباً</div>
            <div class="login-subtitle">سجلي الدخول للمتابعة</div>
            <div class="input-group"><label>اسم المستخدم</label><input type="text" id="usernameInput" placeholder="أدخلي اسم المستخدم" autocomplete="off"></div>
            <div class="input-group"><label>كلمة السر</label><input type="password" id="passwordInput" placeholder="••••••••" autocomplete="off"></div>
            <button class="login-btn" id="loginBtn">تسجيل الدخول</button>
            <div class="music-box">
                <button class="music-btn" id="musicBtn" aria-label="تحكم بالموسيقى">▶</button>
                <div><div class="music-title">🎵 موسيقى هادئة</div><div class="music-label" id="musicStatus">اضغط للتشغيل</div></div>
            </div>
        </div>
    </div>

    <div class="messages-page" id="messagesPage">
        <div class="boxes-container" id="boxesContainer">
            <div class="boxes-track" id="boxesTrack"></div>
        </div>
    </div>

    <div class="private-login-page" id="privateLoginPage">
        <div class="private-login-card">
            <div class="private-close" id="privateClose" aria-label="إغلاق">✕</div>
            <div class="private-login-title">PRIVATE</div>
            <div class="private-login-subtitle">وصول خاص</div>
            <div class="input-group"><label>اسم المستخدم</label><input type="text" id="privateUsernameInput" placeholder="أدخلي اسم المستخدم" autocomplete="off"></div>
            <div class="input-group"><label>كلمة السر</label><input type="password" id="privatePasswordInput" placeholder="••••••••" autocomplete="off"></div>
            <button class="private-login-btn" id="privateLoginBtn">دخول</button>
        </div>
    </div>

    <div class="private-messages-page" id="privateMessagesPage">
        <div class="private-messages-bg"><img src="back2.jpeg" alt="Background" loading="lazy" onerror="this.style.display='none';"></div>
        <div class="private-messages-bg-overlay"></div>
        <div class="boxes-container" id="privateBoxesContainer" style="z-index:10;">
            <div class="boxes-track" id="privateBoxesTrack"></div>
        </div>
    </div>

    <div class="msg-overlay" id="msgOverlay">
        <div class="msg-card" id="msgCard">
            <div class="close-btn" id="closeBtn" aria-label="إغلاق">✕</div>
            <img id="overlayImg" src="" alt="رسالة" loading="lazy">
            <div class="typewriter" id="typewriter"></div>
        </div>
        <div class="nav-arrows">
            <button class="nav-arrow" id="prevArrow" aria-label="السابقة">◀</button>
            <button class="nav-arrow" id="nextArrow" aria-label="التالية">▶</button>
        </div>
    </div>

    <div class="msg-overlay" id="privateMsgOverlay">
        <div class="msg-card" id="privateMsgCard">
            <div class="close-btn" id="privateCloseBtn" aria-label="إغلاق">✕</div>
            <img id="privateOverlayImg" src="" alt="رسالة" loading="lazy">
            <div class="typewriter" id="privateTypewriter"></div>
        </div>
        <div class="nav-arrows">
            <button class="nav-arrow" id="privatePrevArrow" aria-label="السابقة">◀</button>
            <button class="nav-arrow" id="privateNextArrow" aria-label="التالية">▶</button>
        </div>
    </div>

    <audio id="bgMusic" loop preload="none"><source src="music.mp3" type="audio/mpeg"></audio>

    <script>
        // ===== PAGE STACK =====
        const pageStack = [];
        function pushPage(name) { pageStack.push(name);
            history.pushState({page:name}, '', window.location.href); }
        function popPage() { if (pageStack.length>1) { pageStack.pop();
                showPage(pageStack[pageStack.length-1]); return true; } return false; }

        const $ = (id) => document.getElementById(id);
        const loginPageEl = $('loginPage'), messagesPageEl = $('messagesPage');
        const privateLoginPageEl = $('privateLoginPage'), privateMessagesPageEl = $('privateMessagesPage');

        function typeText(el, txt, spd, cb) {
            let i = 0;
            el.innerHTML = '<span class="cursor"></span>';
            function type() {
                if (i < txt.length) {
                    const cur = el.querySelector('.cursor');
                    if (cur) cur.remove();
                    el.innerHTML += txt.charAt(i);
                    el.innerHTML += '<span class="cursor"></span>';
                    i++;
                    el.scrollTop = el.scrollHeight;
                    setTimeout(type, spd);
                } else {
                    const cur = el.querySelector('.cursor');
                    if (cur) cur.remove();
                    if (cb) cb();
                }
            }
            setTimeout(type, spd);
        }

        function createMessageSystem(overlayId, imgId, typewriterId, closeBtnId, prevId, nextId, msgs, imgs, small, total) {
            const msgOverlay = $(overlayId);
            const overlayImg = $(imgId);
            const typewriter = $(typewriterId);
            const closeBtn = $(closeBtnId);
            const prevArrow = $(prevId);
            const nextArrow = $(nextId);
            let _idx = -1;
            let _timer = null;

            function clearTyping() {
                if (_timer) { clearTimeout(_timer);
                    _timer = null; }
                typewriter.innerHTML = '';
            }

            function openCard(i) {
                clearTyping();
                _idx = i;
                const sm = small.includes(i);
                overlayImg.src = 'PH' + imgs[i] + '.jpeg';
                overlayImg.onerror = function() {
                    this.style.display = 'none';
                    const cardEl = $(overlayId.replace('Overlay', 'Card'));
                    if (cardEl) cardEl.style.background = 'linear-gradient(135deg,#1a0a04,#2c1408)';
                };
                overlayImg.onload = function() {
                    this.style.display = 'block';
                    const cardEl = $(overlayId.replace('Overlay', 'Card'));
                    if (cardEl) cardEl.style.background = '';
                };
                typewriter.classList.toggle('small-text', sm);
                msgOverlay.classList.add('show');
                updateArrows();
                typeText(typewriter, msgs[i], sm ? 18 : 16, null);
            }

            function closeCard() {
                clearTyping();
                msgOverlay.classList.remove('show');
                typewriter.innerHTML = '';
                _idx = -1;
            }

            closeBtn.addEventListener('click', closeCard);
            msgOverlay.addEventListener('click', e => { if (e.target === msgOverlay) closeCard(); });

            function updateArrows() {
                prevArrow.disabled = _idx <= 0;
                nextArrow.disabled = _idx >= total - 1;
            }

            function navigate(ni) {
                _idx = ni;
                const sm = small.includes(_idx);
                overlayImg.src = 'PH' + imgs[_idx] + '.jpeg';
                typewriter.classList.toggle('small-text', sm);
                updateArrows();
                clearTyping();
                typeText(typewriter, msgs[_idx], sm ? 18 : 16, null);
            }

            prevArrow.addEventListener('click', e => { e.stopPropagation(); if (_idx > 0) navigate(_idx - 1); });
            nextArrow.addEventListener('click', e => { e.stopPropagation(); if (_idx < total - 1) navigate(_idx + 1); });

            document.addEventListener('keydown', function(e) {
                if (!msgOverlay.classList.contains('show')) return;
                if (e.key === 'Escape') closeCard();
                if (e.key === 'ArrowRight' && _idx < total - 1) navigate(_idx + 1);
                if (e.key === 'ArrowLeft' && _idx > 0) navigate(_idx - 1);
            });

            return openCard;
        }

        function updateCounter() {
